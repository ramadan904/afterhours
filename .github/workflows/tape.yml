# Samples the board for the overnight tape on deployments that have no
# long-running process (e.g. Vercel Hobby, where cron jobs run at most daily).
# Set repository secrets AFTERHOURS_URL and CRON_SECRET to enable it.
name: Overnight tape
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - name: Sample the board
        env:
          AFTERHOURS_URL: ${{ secrets.AFTERHOURS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$AFTERHOURS_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Not configured; skipping."; exit 0; fi
          curl -sf -X POST -H "authorization: Bearer $CRON_SECRET" "$AFTERHOURS_URL/api/cron/tape"
