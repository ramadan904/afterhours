name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # A short load test: fails if more than 1% of requests fail under concurrency.
      - run: npx tsx scripts/load.ts --concurrency 20 --seconds 5
      # The scripted planner is gated on the set it was tuned on, and its
      # score on the held-out set is reported as it is: that gap is why the
      # real planner is Claude on Bedrock.
      - name: Planner eval (scripted rules)
        run: |
          npx tsx scripts/eval-planner.ts --min 0.95
          npx tsx scripts/eval-planner.ts --set planner-holdout
  # Runs the server against live mainnet data (Jupiter + Solana RPC) and the
  # Alexa+ conformance checks, so every push proves the live path, not just
  # the sample one.
  live:
    runs-on: ubuntu-latest
    needs: test
    env:
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789
      PUBLIC_URL: http://localhost:8787
      PORT: "8787"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - run: node dist/src/node.js & sleep 4
      - run: curl -sf localhost:8787/health | tee health.json
      - run: npx tsx scripts/conformance.ts http://localhost:8787
      # Lists any token whose two price legs disagree beyond a real move, with Jupiter's raw row.
      - run: npx tsx scripts/price-audit.ts
        continue-on-error: true
      # The pre-sign check's token-account derivation, against real TSLAx holders.
      - run: npx tsx scripts/ata-check.ts
        continue-on-error: true
      # The token safety parser against the real Token-2022 mints.
      - run: npx tsx scripts/token-safety.ts TSLA NVDA SPY AAPL
        continue-on-error: true
      # Public history sources are unofficial; show what they return, don't fail on them.
      - run: npx tsx scripts/track-record.ts TSLA NVDA COIN
        continue-on-error: true
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install cfn-lint
      - run: cfn-lint infra/aws.yaml
      - run: bash -n scripts/deploy-aws.sh
  # Builds the production image from a clean context, as App Runner and Render
  # will, and checks the container serves.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t afterhours .
      - run: |
          docker run -d --name ah -p 8080:8080 -e AUTH_SECRET="$(openssl rand -base64 48)" -e AFTERHOURS_DATA=sample afterhours
          for i in $(seq 1 20); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs ah; exit 1
  # Accessibility: axe-core (WCAG 2 A/AA + best practices) on every page, both themes.
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: AFTERHOURS_DATA=sample npx tsx src/node.ts & sleep 5
      - run: node e2e/a11y.mjs

  # The real planner, Claude on Amazon Bedrock, against both sets. Runs when
  # the repository has an AWS role to assume (Settings → Variables:
  # AWS_ROLE_ARN, optionally AWS_REGION), via GitHub OIDC; no stored keys.
  planner-bedrock:
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    needs: test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: npx tsx scripts/eval-planner.ts --bedrock --json eval-bedrock.json
      - run: npx tsx scripts/eval-planner.ts --bedrock --set planner-holdout --json eval-bedrock-holdout.json
      - uses: actions/upload-artifact@v4
        with:
          name: planner-eval-bedrock
          path: eval-bedrock*.json
