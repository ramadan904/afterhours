AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Afterhours on AWS: an Alexa+ MCP server on App Runner, state in DynamoDB,
  secrets in Secrets Manager, the overnight tape sampled by EventBridge, and
  Claude on Amazon Bedrock for the simulator's planner.
  Deploy with scripts/deploy-aws.sh (builds and pushes the image, then runs this).

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/afterhours:abc123
  PublicUrl:
    Type: String
    Default: ""
    Description: >
      HTTPS origin the server is reached at. Leave empty on the first deploy;
      deploy-aws.sh fills it with the App Runner URL and redeploys. It's also
      what turns on the EventBridge schedule, which needs a URL to call.
  BedrockModel:
    Type: String
    Default: anthropic.claude-opus-5-5
    Description: Claude model ID on Bedrock for the simulator's planner (enable model access first).
  AlexaClientId:
    Type: String
    Default: ""
    Description: Client ID from the Alexa+ add-on's account linking settings (optional).
  AlexaRedirectUris:
    Type: String
    Default: ""
    Description: Comma-separated redirect URIs Alexa shows for account linking (optional).

  PollyVoice:
    Type: String
    Default: Ruth
    Description: Amazon Polly voice for the simulator (generative or neural, en-US), e.g. Ruth, Matthew, Danielle.
  SmsAlerts:
    Type: String
    Default: "off"
    AllowedValues: ["on", "off"]
    Description: Send alerts by SMS through Amazon SNS too (needs SNS SMS set up and out of the sandbox).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Email for alarm notifications (optional; confirm the subscription email AWS sends).
  DemoWallet:
    Type: String
    Default: ""
    Description: >
      Wallet address the simulator's guided demo uses (optional). Set it to a
      wallet you control to show a real portfolio; empty means each demo gets
      a fresh address no one holds the key to.

Conditions:
  HasPublicUrl: !Not [!Equals [!Ref PublicUrl, ""]]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # Key/value state: OAuth codes, refresh tokens, alerts, the tape, trade proposals.
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: k
          AttributeType: S
      KeySchema:
        - AttributeName: k
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

  # Signs access tokens. Generated here, never typed or committed anywhere.
  AuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Afterhours access-token signing key
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # The client secret Alexa uses for account linking. Generated here; copy it
  # into the Alexa console (deploy-aws.sh prints the command).
  AlexaClientSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Afterhours OAuth client secret for Alexa+ account linking
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # Authenticates EventBridge's calls to /api/cron/tape.
  CronSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Afterhours tape recorder trigger secret
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  # What the running server may do: its table, its secrets, and Claude on Bedrock.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: afterhours-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:UpdateItem]
                Resource: !GetAtt Table.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref AuthSecret, !Ref CronSecret, !Ref AlexaClientSecret]
              # The planner uses the Anthropic Bedrock (Mantle) client, which
              # signs requests for the bedrock-mantle service.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock-mantle:*
                Resource: "*"
              # The simulator speaks its replies with Amazon Polly.
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"
              # Text alerts: SNS publishes straight to verified phone numbers.
              - Effect: Allow
                Action: sns:Publish
                Resource: "*"
              # Metrics are published to the Afterhours namespace only.
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": Afterhours }

  # Lets App Runner pull the image from ECR.
  AccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AccessRole.Arn
        ImageRepository:
          ImageRepositoryType: ECR
          ImageIdentifier: !Ref ImageUri
          ImageConfiguration:
            Port: "8080"
            RuntimeEnvironmentVariables:
              - { Name: NODE_ENV, Value: production }
              - { Name: PUBLIC_URL, Value: !Ref PublicUrl }
              - { Name: DYNAMODB_TABLE, Value: !Ref Table }
              - { Name: AWS_REGION, Value: !Ref AWS::Region }
              - { Name: BEDROCK_MODEL, Value: !Ref BedrockModel }
              - { Name: ALEXA_CLIENT_ID, Value: !Ref AlexaClientId }
              - { Name: ALEXA_REDIRECT_URIS, Value: !Ref AlexaRedirectUris }
              - { Name: METRICS, Value: cloudwatch }
              - { Name: POLLY, Value: "on" }
              - { Name: SMS, Value: !Ref SmsAlerts }
              - { Name: POLLY_VOICE, Value: !Ref PollyVoice }
              - { Name: DEMO_WALLET, Value: !Ref DemoWallet }
            RuntimeEnvironmentSecrets:
              - { Name: AUTH_SECRET, Value: !Ref AuthSecret }
              - { Name: CRON_SECRET, Value: !Ref CronSecret }
              - { Name: ALEXA_CLIENT_SECRET, Value: !Ref AlexaClientSecret }
      InstanceConfiguration:
        Cpu: 0.25 vCPU
        Memory: 0.5 GB
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5

  # The overnight tape: EventBridge calls /api/cron/tape every 5 minutes.
  # (App Runner throttles CPU between requests, so an in-process timer can't
  # be relied on there.)
  TapeConnection:
    Type: AWS::Events::Connection
    Condition: HasPublicUrl
    Properties:
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: Authorization
          ApiKeyValue: !Sub "Bearer {{resolve:secretsmanager:${CronSecret}}}"

  TapeDestination:
    Type: AWS::Events::ApiDestination
    Condition: HasPublicUrl
    Properties:
      ConnectionArn: !GetAtt TapeConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "${PublicUrl}/api/cron/tape"
      InvocationRateLimitPerSecond: 1

  TapeRole:
    Type: AWS::IAM::Role
    Condition: HasPublicUrl
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-tape
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource: !GetAtt TapeDestination.Arn

  TapeSchedule:
    Type: AWS::Events::Rule
    Condition: HasPublicUrl
    Properties:
      Description: Sample the board for the Afterhours overnight tape
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: tape
          Arn: !GetAtt TapeDestination.Arn
          RoleArn: !GetAtt TapeRole.Arn

  # Watching it: alarms go to an SNS topic (and an email, when given), and a
  # dashboard shows latency per tool against the 500 ms budget, the tape
  # sampler's heartbeat, and what it set off.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Afterhours alarms

  AlarmEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Tool p95 latency above 400 ms (Alexa+ allows 500 ms per MCP round trip, network included).
      Namespace: Afterhours
      MetricName: ToolLatency
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 400
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  SamplerAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasPublicUrl
    Properties:
      AlarmDescription: No tape samples for 15 minutes. Alerts, briefings, recurring buys and settlement have stopped.
      Namespace: Afterhours
      MetricName: TapeSamples
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "afterhours-${AWS::Region}"
      DashboardBody: !Sub |
        {
          "widgets": [
            {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "Tool latency (ms), all tools", "region": "${AWS::Region}", "view": "timeSeries", "stat": "p95", "period": 300,
              "metrics": [["Afterhours", "ToolLatency", {"stat": "p50", "label": "p50"}], ["Afterhours", "ToolLatency", {"stat": "p95", "label": "p95"}], ["Afterhours", "ToolLatency", {"stat": "p99", "label": "p99"}]],
              "annotations": {"horizontal": [{"label": "Alexa+ budget", "value": 500}, {"label": "alarm", "value": 400}]}}},
            {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
              "title": "p95 by tool (ms)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
              "metrics": [[{"expression": "SEARCH('{Afterhours,Tool} MetricName=\"ToolLatency\"', 'p95', 300)", "id": "byTool"}]]}},
            {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "Tape sampler heartbeat (per 5 min)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
              "metrics": [["Afterhours", "TapeSamples"]]}},
            {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
              "title": "What it set off", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
              "metrics": [["Afterhours", "AlertsFired"], ["Afterhours", "PushSent"], ["Afterhours", "TradesConfirmed"], ["Afterhours", "ToolErrors"]]}}
          ]
        }

Outputs:
  ServiceUrl:
    Description: App Runner HTTPS host (no scheme)
    Value: !GetAtt Service.ServiceUrl
  McpEndpoint:
    Description: The MCP endpoint to register with Alexa+
    Value: !If [HasPublicUrl, !Sub "${PublicUrl}/mcp", !Sub "https://${Service.ServiceUrl}/mcp"]
  Table:
    Value: !Ref Table
  Dashboard:
    Description: CloudWatch dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=afterhours-${AWS::Region}"
  AlexaClientSecretArn:
    Description: Read with aws secretsmanager get-secret-value, then paste into the Alexa console
    Value: !Ref AlexaClientSecret
  AuthSecretArn:
    Description: The token-signing secret (ARN only); the deploy workflow reads it to run authenticated checks against the live URL
    Value: !Ref AuthSecret
